services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ledger
      MARIADB_USER: ledger
      MARIADB_PASSWORD: change-me
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s

  ledger:
    image: ghcr.io/staal0/ledger:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LEDGER_BASE_URL: http://localhost:8080
      LEDGER_DB_DSN: ledger:change-me@tcp(db:3306)/ledger
      OIDC_ISSUER: https://id.example.com
      OIDC_CLIENT_ID: change-me
      OIDC_CLIENT_SECRET: change-me
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
